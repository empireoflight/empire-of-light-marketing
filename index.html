<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Josefin+Sans:wght@300;400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Defaults (the home page's tags). At build time vite.config.ts writes a copy of this
      file per page with that page's own tags, taken from src/seoPages.ts, so link previews
      that don't run JS still show the right title/description/image. The <Seo> component
      (src/components/Seo.tsx) keeps them in sync client-side once React mounts.
    -->
    <title>Empire of Light | A Heart-Centered Operating System for Collective Intelligence</title>
    <meta
      name="description"
      content="Empire of Light helps people and teams bring more ambitious visions to life faster, with more unity. A heart-centered operating system and collective intelligence platform for teams and Now What? Cohorts."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.empireoflightcollective.com/" />

    <meta property="og:title" content="Empire of Light | A Heart-Centered Operating System for Collective Intelligence" />
    <meta
      property="og:description"
      content="Empire of Light helps people and teams bring more ambitious visions to life faster, with more unity. A heart-centered operating system and collective intelligence platform for teams and Now What? Cohorts."
    />
    <meta property="og:url" content="https://www.empireoflightcollective.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Empire of Light" />
    <meta property="og:image" content="https://www.empireoflightcollective.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Empire of Light | A Heart-Centered Operating System for Collective Intelligence" />
    <meta
      name="twitter:description"
      content="Empire of Light helps people and teams bring more ambitious visions to life faster, with more unity. A heart-centered operating system and collective intelligence platform for teams and Now What? Cohorts."
    />
    <meta name="twitter:image" content="https://www.empireoflightcollective.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
